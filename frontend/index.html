<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rakan | Fresh market in Irbid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head><body><div id="root"></div>
<!-- Shown from the first paint. GlobalLoader.tsx takes over and removes it once React has started. -->
<div id="app-loader" role="status" aria-label="Loading" style="position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#fff">
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;font-family:system-ui,sans-serif">
    <span style="width:48px;height:48px;box-sizing:border-box;border:4px solid var(--color-line,#dce9e0);border-top-color:var(--color-brand,#138040);border-radius:50%;animation:app-spin 1s linear infinite"></span>
    <p style="margin:0;font-size:14px;font-weight:500;color:var(--color-brand,#138040)">Loading...</p>
  </div>
</div>
<style>@keyframes app-spin{to{transform:rotate(360deg)}}</style>
<script type="module" src="/src/main.tsx"></script></body></html>
